name: Build MiAir for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, ARM64 ]
        configuration: [ Release ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Go Core (Dual-Architecture)
        run: |
          cd core
          $goArch = if ("${{ matrix.platform }}" -eq "ARM64") { "arm64" } else { "amd64" }
          $folder = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = $goArch
          New-Item -ItemType Directory -Force -Path "bin/$folder"
          go build -trimpath -ldflags="-s -w" -o "bin/$folder/miair-core.exe" .

      - name: Build WinUI 3 App
        run: |
          $rid = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          msbuild src/MiAir.WinUI/MiAir.WinUI.csproj `
            /restore `
            /t:Publish `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeIdentifier=$rid `
            /p:SelfContained=true `
            /p:WindowsPackageType=None `
            /p:PublishDir="bin/${{ matrix.platform }}/${{ matrix.configuration }}/net8.0-windows10.0.19041.0/$rid/publish/" `
            /v:normal

      - name: Package Output Zip
        run: |
          $rid = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          $publishPath = "src/MiAir.WinUI/bin/${{ matrix.platform }}/${{ matrix.configuration }}/net8.0-windows10.0.19041.0/$rid/publish"
          Compress-Archive -Path "$publishPath/*" -DestinationPath "MiAir-Windows-${{ matrix.platform }}.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiAir-Windows-${{ matrix.platform }}
          path: MiAir-Windows-${{ matrix.platform }}.zip
