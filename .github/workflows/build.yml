name: Build MiAir for Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, ARM64 ]
        configuration: [ Release ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go Core (Dual-Architecture)
        run: |
          cd core
          $goArch = if ("${{ matrix.platform }}" -eq "ARM64") { "arm64" } else { "amd64" }
          $folder = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = $goArch
          New-Item -ItemType Directory -Force -Path "bin/$folder"
          go build -trimpath -ldflags="-s -w" -o "bin/$folder/miair-core.exe" .

      - name: Build WinUI 3 App
        run: |
          $rid = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          $proc = Start-Process dotnet -ArgumentList "publish src/MiAir.WinUI/MiAir.WinUI.csproj -c ${{ matrix.configuration }} -r $rid --self-contained true -p:Platform=${{ matrix.platform }} -p:WindowsPackageType=None -v normal" -NoNewWindow -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Host "Publish failed with exit code $($proc.ExitCode). Checking obj directory..." -ForegroundColor Red
            Get-ChildItem -Path "src/MiAir.WinUI/obj" -Filter "*output.json" -Recurse | ForEach-Object {
              Write-Host "=== Output JSON: $($_.FullName) ===" -ForegroundColor Yellow
              Get-Content $_.FullName
            }
            Get-ChildItem -Path "src/MiAir.WinUI/obj" -Filter "*input.json" -Recurse | ForEach-Object {
              Write-Host "=== Input JSON: $($_.FullName) ===" -ForegroundColor Cyan
              Get-Content $_.FullName
            }
            exit $proc.ExitCode
          }

      - name: Package Output Zip
        run: |
          $rid = if ("${{ matrix.platform }}" -eq "ARM64") { "win-arm64" } else { "win-x64" }
          $publishPath = "src/MiAir.WinUI/bin/${{ matrix.platform }}/${{ matrix.configuration }}/net8.0-windows10.0.19041.0/$rid/publish"
          Compress-Archive -Path "$publishPath/*" -DestinationPath "MiAir-Windows-${{ matrix.platform }}.zip" -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MiAir-Windows-${{ matrix.platform }}
          path: MiAir-Windows-${{ matrix.platform }}.zip
